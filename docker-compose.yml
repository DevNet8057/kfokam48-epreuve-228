services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-k48}
      POSTGRES_USER: ${DB_USERNAME:-k48}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-k48}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-k48} -d ${DB_NAME:-k48}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - k48-db-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-k48}
      DB_USERNAME: ${DB_USERNAME:-k48}
      DB_PASSWORD: ${DB_PASSWORD:-k48}
      DB_DRIVER: org.postgresql.Driver
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  k48-db-data:
